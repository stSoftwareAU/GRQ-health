<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRQ Health Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            min-width: 150px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .healthy { color: #28a745; }
        .warning { color: #ffc107; }
        .critical { color: #dc3545; }

        .hosts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .host-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .host-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
        }

        .host-card.unhealthy {
            border-left: 5px solid #dc3545;
            background: rgba(255, 255, 255, 0.98);
        }

        .host-card.warning {
            border-left: 5px solid #ffc107;
        }

        .host-card.healthy {
            border-left: 5px solid #28a745;
        }

        .host-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .host-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
        }

        .health-status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .health-status.healthy {
            background: #d4edda;
            color: #155724;
        }

        .health-status.warning {
            background: #fff3cd;
            color: #856404;
        }

        .health-status.critical {
            background: #f8d7da;
            color: #721c24;
        }

        .host-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            color: #666;
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: 500;
            color: #333;
        }

        .last-seen {
            font-size: 0.8rem;
            color: #888;
            text-align: right;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 50px;
        }

        .error {
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .filter-controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        @media (max-width: 768px) {
            .hosts-grid {
                grid-template-columns: 1fr;
            }
            
            .stats-bar {
                flex-direction: column;
                align-items: center;
            }
            
            .stat-card {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🖥️ GRQ Health Dashboard</h1>
            <p>Real-time monitoring of system health across all hosts</p>
        </div>

        <button class="refresh-btn" onclick="loadData()">🔄 Refresh Data</button>

        <div class="filter-controls">
            <button class="filter-btn active" onclick="filterHosts('all', event)">All Hosts</button>
            <button class="filter-btn" onclick="filterHosts('healthy', event)">Healthy</button>
            <button class="filter-btn" onclick="filterHosts('warning', event)">Warning</button>
            <button class="filter-btn" onclick="filterHosts('critical', event)">Critical</button>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-number healthy" id="totalHosts">-</div>
                <div class="stat-label">Total Hosts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number healthy" id="healthyHosts">-</div>
                <div class="stat-label">Healthy</div>
            </div>
            <div class="stat-card">
                <div class="stat-number warning" id="warningHosts">-</div>
                <div class="stat-label">Warning</div>
            </div>
            <div class="stat-card">
                <div class="stat-number critical" id="criticalHosts">-</div>
                <div class="stat-label">Critical</div>
            </div>
        </div>

        <div id="criticalSection" style="display: none; margin-bottom: 20px;">
            <div style="background: #dc3545; color: white; border-radius: 10px; padding: 15px;">
                <h3 style="color: white; margin: 0 0 10px 0;">🚨 Critical Hosts - Action Required</h3>
                <div id="criticalHostsList"></div>
            </div>
        </div>

        <div id="content">
            <div class="loading">Loading health data...</div>
        </div>
    </div>

    <script>
        let currentFilter = 'all';
        let allHosts = [];

        function formatUptime(seconds) {
            if (seconds < 60) return `${seconds}s`;
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h`;
            return `${Math.floor(seconds / 86400)}d`;
        }

        function formatTimestamp(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diffMs = now - date;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            
            if (diffHours < 1) return 'Just now';
            if (diffHours < 24) return `${diffHours}h ago`;
            return `${Math.floor(diffHours / 24)}d ago`;
        }

        function getHealthStatus(heartbeatTs) {
            const now = Math.floor(Date.now() / 1000);
            const hoursSinceHeartbeat = (now - heartbeatTs) / 3600;
            
            // Handle timezone issues - if heartbeat is in the future, assume it's recent
            if (heartbeatTs > now) {
                return 'healthy';
            }
            
            if (hoursSinceHeartbeat <= 24) return 'healthy';
            if (hoursSinceHeartbeat <= 48) return 'warning';
            return 'critical';
        }

        function createHostCard(hostname, data) {
            const healthStatus = getHealthStatus(data.heart_beat_ts);
            const statusClass = healthStatus;
            // Check if log file exists (assume if host is present, log may be present)
            const logUrl = `./${hostname}/node.log`;
            return `
                <div class="host-card ${statusClass}" data-status="${healthStatus}">
                    <div class="host-header">
                        <div class="host-name">${hostname}</div>
                        <div class="health-status ${statusClass}">${healthStatus}</div>
                    </div>
                    <div class="host-info">
                        <div class="info-item">
                            <span class="info-label">OS:</span>
                            <span class="info-value">${data.os_info} ${data.os_version}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Uptime:</span>
                            <span class="info-value">${formatUptime(data.uptime)}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Free Disk:</span>
                            <span class="info-value">${data.free_disk_space}GB</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Memory:</span>
                            <span class="info-value">${data.mem_usage_percent}%</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">CPU Load:</span>
                            <span class="info-value">${data.cpu_load}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Network:</span>
                            <span class="info-value">${data.network_status}</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Timezone:</span>
                            <span class="info-value">${data.timezone}</span>
                        </div>
                    </div>
                    <div class="last-seen">Last seen: ${formatTimestamp(data.heart_beat_ts)}</div>
                    <div style="margin-top:10px;text-align:right;">
                        <a href="${logUrl}" target="_blank" style="color:#007bff;text-decoration:underline;">View node.log</a>
                    </div>
                </div>
            `;
        }

        function updateStats(hosts) {
            const stats = {
                total: hosts.length,
                healthy: hosts.filter(h => getHealthStatus(h.heart_beat_ts) === 'healthy').length,
                warning: hosts.filter(h => getHealthStatus(h.heart_beat_ts) === 'warning').length,
                critical: hosts.filter(h => getHealthStatus(h.heart_beat_ts) === 'critical').length
            };

            document.getElementById('totalHosts').textContent = stats.total;
            document.getElementById('healthyHosts').textContent = stats.healthy;
            document.getElementById('warningHosts').textContent = stats.warning;
            document.getElementById('criticalHosts').textContent = stats.critical;

            // Show critical hosts section if there are any
            const criticalSection = document.getElementById('criticalSection');
            const criticalHostsList = document.getElementById('criticalHostsList');
            
            if (stats.critical > 0) {
                const criticalHosts = hosts.filter(([hostname, data]) => getHealthStatus(data.heart_beat_ts) === 'critical');
                const criticalHtml = criticalHosts.map(([hostname, data]) => {
                    const hoursSince = Math.floor((Math.floor(Date.now() / 1000) - data.heart_beat_ts) / 3600);
                    return `<div style="margin:5px 0; padding: 8px; background: rgba(0,0,0,0.15); color: white; border-radius: 5px;">
                        <strong>${hostname}</strong> - Last seen: ${formatTimestamp(data.heart_beat_ts)} (${hoursSince} hours ago)
                    </div>`;
                }).join('');
                criticalHostsList.innerHTML = criticalHtml;
                criticalSection.style.display = 'block';
            } else {
                criticalSection.style.display = 'none';
            }
        }

        function filterHosts(filter, event) {
            currentFilter = filter;
            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            if (event && event.target) {
                event.target.classList.add('active');
            }
            // Filter hosts
            const filteredHosts = allHosts.filter(([hostname, data]) => {
                const status = getHealthStatus(data.heart_beat_ts);
                return filter === 'all' || status === filter;
            });
            // Sort: critical first, then warning, then healthy
            filteredHosts.sort(([a, dataA], [b, dataB]) => {
                const statusA = getHealthStatus(dataA.heart_beat_ts);
                const statusB = getHealthStatus(dataB.heart_beat_ts);
                const priority = { critical: 3, warning: 2, healthy: 1 };
                return priority[statusB] - priority[statusA];
            });
            displayHosts(filteredHosts);
        }

        function displayHosts(hosts) {
            const content = document.getElementById('content');
            
            if (hosts.length === 0) {
                content.innerHTML = '<div class="loading">No hosts found matching the current filter.</div>';
                return;
            }
            
            const hostsHtml = hosts.map(([hostname, data]) => createHostCard(hostname, data)).join('');
            content.innerHTML = `<div class="hosts-grid">${hostsHtml}</div>`;
        }

        async function loadData() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Loading health data...</div>';
            
            try {
                const response = await fetch('./index.json');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                allHosts = Object.entries(data);
                
                updateStats(allHosts);
                filterHosts(currentFilter);
                
            } catch (error) {
                console.error('Error loading data:', error);
                content.innerHTML = `
                    <div class="error">
                        <h3>Error Loading Data</h3>
                        <p>Failed to load health data: ${error.message}</p>
                        <p>Make sure the index.json file exists and is accessible.</p>
                    </div>
                `;
            }
        }

        // Load data on page load
        document.addEventListener('DOMContentLoaded', loadData);
        
        // Auto-refresh every 5 minutes
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
