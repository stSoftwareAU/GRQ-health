<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer - GRQ Health Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
        }
        .log-container {
            background-color: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            padding: 20px;
            margin: 80px 20px 20px 20px;
            max-height: 95vh;
            overflow-y: auto;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        @media (max-width: 768px) {
            .log-container {
                margin: 60px 5px 5px 5px;
                max-height: 93vh;
            }
            .log-content {
                max-height: 88vh;
            }
        }
        .log-header {
            background-color: #2d2d2d;
            color: #ffffff;
            padding: 8px 15px;
            border-radius: 8px 8px 0 0;
            margin-bottom: 0;
            font-size: 14px;
        }
        .log-header .log-title {
            margin: 0;
            font-weight: 600;
            font-size: 14px;
        }
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        @media (max-width: 768px) {
            .back-button {
                top: 10px;
                left: 10px;
            }
            .back-button .btn {
                font-size: 14px;
                padding: 8px 12px;
            }
        }
        .log-content {
            background-color: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 0 0 8px 8px;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 85vh;
            overflow-y: auto;
        }
        .error-line {
            background-color: rgba(220, 53, 69, 0.1);
            border-left: 3px solid #dc3545;
            padding-left: 10px;
        }
        .stack-trace-line {
            background-color: rgba(220, 53, 69, 0.05);
            padding-left: 10px;
            color: #ff9999;
        }
        .warning-line {
            background-color: rgba(255, 193, 7, 0.1);
            border-left: 3px solid #ffc107;
            padding-left: 10px;
        }
        .debug-line {
            background-color: rgba(13, 202, 240, 0.1);
            border-left: 3px solid #0dcaf0;
            padding-left: 10px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #6c757d;
        }
        .error {
            text-align: center;
            padding: 50px;
            color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="back-button">
            <a href="index.html" class="btn btn-primary">
                <i class="bi bi-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        
        <div class="row">
            <div class="col-12">
                <div id="logContainer" class="log-container">
                    <div class="loading">
                        <i class="bi bi-hourglass-split"></i> Loading log file...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get the log file path from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const logFile = urlParams.get('file');
        
        if (!logFile) {
            document.getElementById('logContainer').innerHTML = `
                <div class="error">
                    <i class="bi bi-exclamation-triangle"></i>
                    <h4>No log file specified</h4>
                    <p>Please provide a log file path in the URL parameters.</p>
                </div>
            `;
        } else {
            loadLogFile(logFile);
        }
        
        async function loadLogFile(filePath) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const logContent = await response.text();
                
                // Extract hostname from file path for display
                const hostname = filePath.split('/')[1] || 'Unknown';
                
                // Process log content to highlight errors, warnings, and debug messages
                const processedContent = processLogContent(logContent);
                
                document.getElementById('logContainer').innerHTML = `
                    <div class="log-header">
                        <div class="log-title"><i class="bi bi-file-text"></i> ${hostname}/node.log <small class="text-muted">• ${new Date().toLocaleString()}</small></div>
                    </div>
                    <div class="log-content">${processedContent}</div>
                `;
                
                // Update page title
                document.title = `${hostname} Log - GRQ Health Dashboard`;
                
                // Scroll to first stack trace after a brief delay to ensure rendering is complete
                setTimeout(scrollToFirstStackTrace, 300);
                
            } catch (error) {
                console.error('Error loading log file:', error);
                document.getElementById('logContainer').innerHTML = `
                    <div class="error">
                        <i class="bi bi-exclamation-triangle"></i>
                        <h4>Error Loading Log File</h4>
                        <p>Failed to load log file: ${error.message}</p>
                        <p>File path: ${filePath}</p>
                    </div>
                `;
            }
        }
        
        function processLogContent(content) {
            const lines = content.split('\n');
            return lines.map((line, index) => {
                // Check if this is a stack trace line (starts with whitespace + "at ")
                const isStackTraceLine = /^\s+at /.test(line);
                
                // Highlight different types of log messages
                // Be specific to avoid false positives from training metrics that mention "Error:"
                if (line.includes('ERROR') || 
                    line.includes('Exception') || 
                    line.startsWith('Error:') ||
                    /Discovery failed/.test(line) ||
                    /\bfailed\b.*Error:/.test(line)) {
                    return `<div class="error-line" data-line-index="${index}">${escapeHtml(line)}</div>`;
                } else if (isStackTraceLine) {
                    return `<div class="stack-trace-line" data-line-index="${index}">${escapeHtml(line)}</div>`;
                } else if (line.includes('WARNING') || line.includes('Warning:') || line.includes('⚠️')) {
                    return `<div class="warning-line" data-line-index="${index}">${escapeHtml(line)}</div>`;
                } else if (line.includes('DEBUG:')) {
                    return `<div class="debug-line" data-line-index="${index}">${escapeHtml(line)}</div>`;
                } else {
                    return `<div data-line-index="${index}">${escapeHtml(line)}</div>`;
                }
            }).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function scrollToFirstStackTrace() {
            // Find the first error line that has a stack trace below it
            const logContent = document.querySelector('.log-content');
            if (!logContent) return;
            
            // First check if there are any stack traces at all
            const stackTraces = logContent.querySelectorAll('.stack-trace-line');
            if (stackTraces.length === 0) {
                // No stack traces found - don't scroll, stay at the top
                return;
            }
            
            // There are stack traces, now find the first one and look for the error line above it
            const firstStackTrace = stackTraces[0];
            
            // Try to find the error message that precedes this stack trace
            let currentElement = firstStackTrace.previousElementSibling;
            let searchCount = 0;
            
            // Look backwards up to 3 lines to find the error line
            while (currentElement && searchCount < 3) {
                if (currentElement.classList && currentElement.classList.contains('error-line')) {
                    // Found the error line that precedes the stack trace
                    currentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    return;
                }
                currentElement = currentElement.previousElementSibling;
                searchCount++;
            }
            
            // If we couldn't find an error line before the stack trace, just scroll to the stack trace itself
            firstStackTrace.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    </script>
</body>
</html>
