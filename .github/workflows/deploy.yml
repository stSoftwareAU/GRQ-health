name: Deploy to GitHub Pages

# Supply-chain policy: every third-party action below is pinned to a 40-char
# commit SHA, with the human-readable version recorded as a trailing comment.
# Do not replace the SHA with a moving tag (e.g. @v4) when bumping versions —
# resolve the new tag to its commit SHA and update both the SHA and the
# trailing # vX.Y.Z comment in lock-step. See issue #93 / VibeCoding #1613.

on:
  push:
    branches: [ Develop ]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The health monitor pushes docs/** updates to Develop very frequently (many
# hosts, every few minutes), so deploy runs overlap. With cancel-in-progress
# false these queued deployments race on the Pages backend and a superseded
# deployment reports "Deployment failed, try again later." (issue #148).
# Setting cancel-in-progress true lets a newer run cancel an older in-flight
# deployment in the shared "pages" group, so only the latest — and freshest —
# health data deploys. The dashboard always wants the most recent data, so
# cancelling a superseded deploy is the desired behaviour.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Suppress the Node punycode DEP0040 deprecation warning emitted from
    # within the GitHub-provided actions (issue #146). We are already on the
    # latest actions/deploy-pages (v5.0.0); the warning originates in that
    # external action's bundled dependencies, so we silence it at the Node
    # runtime via --no-deprecation rather than patching an external action.
    env:
      NODE_OPTIONS: --no-deprecation
    # Declare the canonical github-pages deployment environment recommended by
    # GitHub for actions/deploy-pages. This makes the deployment observable
    # (surfaces the published page URL) and is the supported configuration for
    # Pages deployments.
    environment:
      name: github-pages
      # The deploy step is retried in-run (issue #151), so page_url can come
      # from whichever attempt succeeded. Prefer the final attempt's id
      # ('deployment', preserved from before) and fall back to the earlier
      # attempts, so the published URL stays observable regardless of which
      # attempt won.
      url: ${{ steps.deployment.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs'

      # In-run retry with backoff (issue #151). Frequent overlapping health
      # pushes make deploys contend on the Pages backend, which transiently
      # reports "Deployment failed, try again later." Retrying the deploy step
      # in-run absorbs that contention so only a genuine, persistent error
      # surfaces as a failed run (and an email). cancel-in-progress from
      # issue #148 still applies: a newer push cancels these attempts and a
      # `cancelled` conclusion is not treated as a failure.
      #
      # Attempts 1 and 2 use continue-on-error so a transient failure falls
      # through to the next attempt rather than failing the run. The final
      # attempt keeps id 'deployment' and does NOT swallow errors, so an
      # exhausted retry budget fails the run and notifies, as before.
      - name: Deploy to GitHub Pages (attempt 1 of 3)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Backoff before attempt 2 (30s)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 2 of 3)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Backoff before attempt 3 (60s)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 3 of 3)
        id: deployment
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
