name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, Develop ]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Run repo feed tests
        run: deno test --allow-read --allow-write --allow-env helpers/repo_feed_health_test.ts
      
      - name: Lint repo feed scripts
        run: deno lint helpers/repo_feed_health.ts helpers/repo_feed_health_test.ts
      
      - name: Generate repo freshness data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: deno run --allow-net=api.github.com --allow-read=config --allow-write=docs helpers/repo_feed_health.ts
        
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 