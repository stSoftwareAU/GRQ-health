name: Semgrep

on:
  pull_request:
    branches: ["*"]

# Cancel a superseded run when a new commit is pushed to the same PR
# branch (issue #187). Keying the group on github.ref keeps each branch in
# its own group, so concurrent PRs never cancel each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      # actions/checkout v4 — pinned to commit SHA per supply-chain policy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep ci --config p/default
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
