name: ShellCheck

on:
  pull_request:
    branches: ["*"]

# Cancel a superseded run when a new commit is pushed to the same PR
# branch (issue #187). Keying the group on github.ref keeps each branch in
# its own group, so concurrent PRs never cancel each other's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v4 — pinned to commit SHA per supply-chain policy
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ludeeus/action-shellcheck v2.0.0 — pinned to commit SHA per supply-chain policy
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: .
          severity: warning
